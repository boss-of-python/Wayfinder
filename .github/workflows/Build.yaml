# Builds the unsigned development APK in the cloud, with no local Unity installation.
#
# HOW TO USE IT
#   1. Put the three Unity secrets on the repository once (Settings -> Secrets and variables
#      -> Actions). Detailed instructions: Docs/ANDROID_CLOUD_BUILD.md.
#        - UNITY_LICENSE   contents of a personal .ulf file (free Unity Personal license)
#        - UNITY_EMAIL     the Unity ID email that owns that license
#        - UNITY_PASSWORD  the password for that Unity ID
#   2. Push to main/master or open Actions -> "Build Android APK" -> Run workflow.
#   3. Download the "Wayfinder-APK" artifact at the bottom of the finished run page, unzip it,
#      copy Wayfinder-dev.apk to the phone and install it.
#
# All 30 required 3D streaming assets (Assets/StreamingAssets/Models/*.obj +
# Assets/Wayfinder/Content/streaming_assets.json) are cryptographically verified (SHA-256 + LF +
# triangle budgets) and staged into Assets/Wayfinder/Resources/StreamingModels/ prior to Unity
# import so all 4 vehicles, wheels, garages, camps, relays, landmarks, bridges, caches, and
# 5-biome props compile directly into the scenes and player APK.

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.26f1

jobs:
  apk:
    name: Build Wayfinder-dev.apk
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free runner disk space (Unity's Android image is ~15 GB)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          lfs: true

      - name: Verify and stage 30 required 3D streaming assets
        run: |
          python3 Tools/Art/generate_streaming_assets.py --verify --mirror-resources

      - name: Pre-create APK error log
        run: |
          mkdir -p error_logs
          {
            echo "=== Wayfinder Android APK Build Error Log ==="
            echo "Run ID: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "Ref:    ${{ github.ref }}"
            echo "3D Assets: 30 verified .obj models staged in Assets/StreamingAssets/Models + Resources/StreamingModels"
            echo ""
          } > error_logs/apk-build-errors.log

      - name: Check Unity authentication secrets exist
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash Tools/Build/check_unity_secrets.sh

      - name: Prepare Unity cache and diagnostic log folders
        run: mkdir -p Library Logs Builds/Logs

      - name: Reuse Unity's import cache from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.3
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Ensure Android SDK packages are installed
        run: |
          ANDROID_HOME="/opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer/SDK"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /opt/unity -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "Found sdkmanager at $SDKMANAGER; ensuring platforms;android-34, platforms;android-35 and build-tools;34.0.0, build-tools;35.0.0..."
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not present on host runner (runs inside game-ci container); skipping host check."
          fi

      - name: "Unity 1 of 2: Setup Project (scenes, URP, player settings)"
        id: unity_setup
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidTargetSdkVersion: '35'
          buildMethod: Wayfinder.Editor.ProjectSetup.Setup
          buildsPath: Builds
          allowDirtyBuild: true

      - name: "Unity 2 of 2: Build the development APK"
        id: unity_build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidTargetSdkVersion: '35'
          buildMethod: Wayfinder.Editor.BuildCommands.BuildAndroidDev
          buildsPath: Builds
          allowDirtyBuild: true

      - name: Report the real Unity failure as annotations
        if: always()
        env:
          UNITY_SETUP_OUTCOME: ${{ steps.unity_setup.outcome }}
          UNITY_BUILD_OUTCOME: ${{ steps.unity_build.outcome }}
        run: |
          mkdir -p error_logs
          bash Tools/Build/report_unity_failure.sh "$PWD" | tee -a error_logs/apk-build-errors.log

      - name: Upload Unity logs and the resolved package lock (for offline diagnosis)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: Wayfinder-Unity-logs
          path: |
            Logs/
            Builds/Logs/
            error_logs/
            Packages/packages-lock.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: Wayfinder-APK
          path: Builds/Android/Wayfinder-dev.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the APK error log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: Wayfinder-APK-error-logs
          path: error_logs/
          if-no-files-found: warn
          retention-days: 14
