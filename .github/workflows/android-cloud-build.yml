# Free cloud build of an installable development APK, using GameCI on GitHub's own machines.
# Manual only: Actions tab -> "Android APK (free cloud build)" -> Run workflow.
name: Android APK (free cloud build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cloud-build
  cancel-in-progress: false

env:
  # Unity 6.3 LTS release verified against this project by a real editor run
  # (2026-10-15: editor 6000.3.26f1 / de8167e7440c imported the project and
  # compiled the six engine-free Wayfinder assemblies — see Docs/KNOWN_ISSUES.md KI-002).
  UNITY_VERSION: 6000.3.26f1

jobs:
  apk:
    name: Build Wayfinder-dev.apk
    # Pinned, not ubuntu-latest: run 38875757162 carried GitHub's own notice that the
    # ubuntu-latest label migrates to Ubuntu 26 from 2026-10-19. A 9 GB Docker Unity build
    # must not change host OS silently between two dispatches. A standard runner is still
    # free on public repositories; bump this pin deliberately, with a run to prove it.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Accept either UNITY_LICENSE or both Unity account credentials; the latter activated this
      # project's Personal license in run 38754979851. Check before costly cleanup; never print values.
      - name: Check Unity authentication secrets exist (values are never printed)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash Tools/Build/check_unity_secrets.sh

      # Idempotent: the committed version is authoritative. Fail before expensive runner setup on mismatch.
      - name: Pin the Unity version for this build only (nothing is committed)
        run: python3 Tools/Build/pin_toolchain.py --editor-version "$UNITY_VERSION"

      - name: Free disk space (the Unity Android image is about 9 GB)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true # the Unity image brings its own Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Unity's editor log goes to the container's stdout (game-ci runs `unity-editor
      # -logfile /dev/stdout`), so it lands in the job log, not here; Logs/ still collects
      # Unity's worker logs and this project's own failure breadcrumb. Pre-create Library so a
      # cold cache is a normal empty cache, not a missing-path warning.
      - name: Prepare Unity cache and diagnostic log folders
        run: mkdir -p Library Logs Builds/Logs

      - name: Reuse Unity's import cache from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      # No `customParameters: -logFile ...`: game-ci's build.sh passes `-logfile /dev/stdout`
      # before any custom parameter, and run 38875757162 showed the override produced no
      # readable editor log — only Unity's worker logs, which explain nothing. The log is
      # recovered from the Actions API by the `diagnose` job below.
      - name: "Unity 1 of 2: Setup Project (scenes, URP, player settings)"
        id: unity_setup
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Wayfinder.Editor.ProjectSetup.Setup
          versioning: 'None'
          allowDirtyBuild: true

      - name: "Unity 2 of 2: Build the development APK"
        id: unity_build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Wayfinder.Editor.BuildCommands.BuildAndroidDev
          versioning: 'None'
          allowDirtyBuild: true

      # Unity's own exit code is famously undescriptive ("Build failed with exit code 1").
      # This turns whatever survived in the workspace (worker logs, and this project's
      # Logs/wayfinder-editor-failure.log breadcrumb) into check-run annotations, and says
      # plainly when no editor log was available instead of reporting nothing at all.
      # Only run after at least one Unity step was attempted; preflight failures have no log.
      - name: Report the real Unity failure as annotations
        if: ${{ always() && (steps.unity_setup.outcome == 'success' || steps.unity_setup.outcome == 'failure' || steps.unity_setup.outcome == 'cancelled' || steps.unity_build.outcome == 'success' || steps.unity_build.outcome == 'failure' || steps.unity_build.outcome == 'cancelled') }}
        continue-on-error: true
        env:
          UNITY_SETUP_OUTCOME: ${{ steps.unity_setup.outcome }}
          UNITY_BUILD_OUTCOME: ${{ steps.unity_build.outcome }}
        run: bash Tools/Build/report_unity_failure.sh

      # packages-lock.json is what Unity really resolved (KI-002): download it from this
      # artefact and commit it, so the next build resolves the identical package set.
      - name: Upload Unity logs and the resolved package lock (for offline diagnosis)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-logs
          path: |
            Builds/Logs/
            Logs/
            Packages/packages-lock.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wayfinder-dev-APK
          path: Builds/Android/Wayfinder-dev.apk
          if-no-files-found: error
          retention-days: 7

  # The build job's own log *is* Unity's editor log (game-ci: `unity-editor -logfile /dev/stdout`).
  # Once that job has finished, the Actions API serves it as plain text, so this job can publish
  # the real cause as annotations — readable with
  # `gh api repos/{owner}/{repo}/check-runs/{job-id}/annotations` from anywhere, without the
  # raw-log host. Reporting only: it never fails the workflow and never touches the APK.
  diagnose:
    name: Explain the Unity result
    needs: apk
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs
    steps:
      - name: Check out the diagnostics scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build job's log (Unity logs to stdout, not to the workspace)
        id: job_log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Tools/Build/fetch_job_log.sh "Build Wayfinder-dev.apk" Logs/unity-job-log.txt 12 10

      - name: Report the real Unity result as annotations
        continue-on-error: true
        env:
          UNITY_JOB_RESULT: ${{ needs.apk.result }}
        run: bash Tools/Build/report_unity_failure.sh "$PWD" Logs/unity-job-log.txt

      - name: Upload the build job log (plain text, no raw-log host needed)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-job-log
          path: Logs/unity-job-log.txt
          if-no-files-found: ignore
          retention-days: 7
